openapi: 3.0.3
info:
  title: discogs-fade-backend
  version: 0.1.0
  description: >
    Boundary between the extension and Discogs' API. Wraps GET /masters/{id} and
    GET and POST /fade — master DTOs are currently unscoped (all Discogs response
    fields kept as-is). GET /releases/{id} serves a trimmed release from our
    own database. Also exposes
    /sellers/... endpoints that list indexed sellers, trigger and report on
    indexing a Discogs seller's marketplace inventory into a local database
    via a Discogs-rate-limited background queue, and browse/filter/sort the
    resulting inventory.
paths:
  /releases:
    get:
      operationId: listReleases
      summary: List every enriched release, whatever seller has it (or had it)
      description: >
        Takes the same paging, filter and sort query parameters as
        GET /sellers/{username}/inventory, with the same defaults and the same
        400 on invalid input. Releases no seller currently lists are included.
        Releases the user has faded (directly or through their master) are
        left out of items and total.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50 }
        - $ref: "#/components/parameters/StyleCombo"
        - name: genre
          in: query
          description: Comma-separated genre names, OR-matched
          schema:
            type: string
        - name: style
          in: query
          description: Comma-separated style names, OR-matched
          schema:
            type: string
        - name: format
          in: query
          description: Comma-separated format names (e.g. Vinyl, CD), OR-matched
          schema:
            type: string
        - name: country
          in: query
          description: Comma-separated country names, OR-matched
          schema:
            type: string
        - name: tracks
          in: query
          description: Comma-separated track counts, OR-matched; each is 1 to 6, or 7+ for seven or more
          schema:
            type: string
        - name: excludeGenre
          in: query
          description: Comma-separated genre names; releases with any of them are left out
          schema:
            type: string
        - name: excludeStyle
          in: query
          description: Comma-separated style names; releases with any of them are left out
          schema:
            type: string
        - name: excludeFormat
          in: query
          description: Comma-separated format names; releases with any of them are left out
          schema:
            type: string
        - name: onlyGenre
          in: query
          description: Comma-separated genre names; keeps releases whose genres are all in the list
          schema:
            type: string
        - name: onlyStyle
          in: query
          description: Comma-separated style names; keeps releases whose styles are all in the list
          schema:
            type: string
        - name: onlyFormat
          in: query
          description: Comma-separated format names; keeps releases whose formats are all in the list
          schema:
            type: string
        - name: noLinks
          in: query
          description: "only keeps releases with no video links; exclude leaves them out"
          schema:
            type: string
            enum: [only, exclude]
        - name: yearMin
          in: query
          schema: { type: integer }
        - name: yearMax
          in: query
          schema: { type: integer }
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [title, -title, year, -year, artist, -artist, format, -format, rating, -rating, tracks, -tracks]
            default: title
      responses:
        "200":
          description: Paginated releases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseListPageDto"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /releases/facets:
    get:
      operationId: getReleaseFacets
      summary: >
        The genres, styles, format names and countries of all enriched releases,
        each with how many releases carry it, counted among the releases the same
        filters would list (faded ones excluded).
      parameters:
        - $ref: "#/components/parameters/Genre"
        - $ref: "#/components/parameters/Style"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Tracks"
        - $ref: "#/components/parameters/ExcludeGenre"
        - $ref: "#/components/parameters/ExcludeStyle"
        - $ref: "#/components/parameters/ExcludeFormat"
        - $ref: "#/components/parameters/OnlyGenre"
        - $ref: "#/components/parameters/OnlyStyle"
        - $ref: "#/components/parameters/OnlyFormat"
        - $ref: "#/components/parameters/NoLinks"
        - $ref: "#/components/parameters/YearMin"
        - $ref: "#/components/parameters/YearMax"
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseFacetsDto"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /releases/{id}:
    get:
      operationId: getRelease
      summary: >
        Get a release by id from our database; falls back to a live Discogs
        fetch (saved for next time) when it is not indexed yet.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Release found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetailDto"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "502":
          description: Discogs fetch failed after retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Discogs is erroring and the queue is paused, retrying; try again shortly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "504":
          description: Timed out waiting for the Discogs fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /releases/{id}/refresh:
    post:
      operationId: refreshRelease
      summary: >
        Force-refresh a release: fetch it live from Discogs (ahead of any
        background indexing in the queue), overwrite everything stored for it,
        and return the fresh release.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Release refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetailDto"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Release not found on Discogs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "502":
          description: Discogs fetch failed after retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Discogs is erroring and the queue is paused, retrying; try again shortly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "504":
          description: Timed out waiting for the Discogs fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /fade:
    get:
      operationId: getFades
      summary: List what the signed-in user has faded
      description: >
        Faded masters and releases without a master. A release is hidden when
        its own id is in releaseIds or its master id is in masterIds, which
        also covers versions added to a faded master later. versionReleaseIds
        lists the versions of the faded masters found so far, and
        failedLookups the fades Discogs could not resolve.
      responses:
        "200":
          description: Faded ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FadedIdsDto"
    post:
      operationId: fade
      summary: >
        Fade a release or a master for the signed-in user. Any release or
        master can be faded, indexed or not. A release with a known master is
        stored as that master, hiding every version under it. Any other
        release is stored as itself, and a lookup (queued ahead of scans and
        enrichment) upgrades it to its master and stores the master's
        versions. The request waits for that lookup (up to about 20 seconds),
        so the answer names the fade and counts what it hides. If the wait
        runs out, or Discogs is paused, lookupStatus is pending, versionCount
        is null and the lookup carries on in the background. Fading a failed
        fade again retries its lookup. Otherwise idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FadeRequestDto"
      responses:
        "200":
          description: Fade stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FadeResponseDto"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
    delete:
      operationId: unfade
      summary: >
        Unfade a release or a master for the signed-in user. A release with a
        master unfades that master and every version under it. Releases that
        the fade kept out of enrichment are queued for enrichment again, unless
        another fade of the user still covers them. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FadeRequestDto"
      responses:
        "204":
          description: Fade removed, or there was none
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /fade/items:
    get:
      operationId: getFadedItems
      summary: Page through what the signed-in user has faded
      description: >
        One row per stored fade (a master, or a release without a master),
        newest first, each with the lowest-id indexed release it hides.
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: >
            Case-insensitive substring of a title or artist name of any indexed
            release the fade hides.
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, default: 50 }
      responses:
        "200":
          description: A page of fades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FadedItemsDto"
        "400":
          description: Invalid page or pageSize
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /settings:
    get:
      operationId: getSettings
      summary: The signed-in user's settings
      description: >
        A setting the user never changed holds its default, so a user with no
        stored settings gets them all.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDto"
    patch:
      operationId: updateSettings
      summary: Change some of the signed-in user's settings
      description: >
        Takes any subset of the settings; the ones left out stay as they are.
        An empty body changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequestDto"
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDto"
        "400":
          description: A setting holds a value it does not allow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /masters/{id}:
    get:
      operationId: getMaster
      summary: Get a master release by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Master found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDetailDto"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Master not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /sellers:
    get:
      operationId: listSellers
      summary: List every seller that has ever been indexed
      responses:
        "200":
          description: Sellers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerSummaryDto"
  /sellers/{username}/preview:
    get:
      operationId: previewSeller
      summary: >
        What Discogs says about a seller before it is indexed: profile, rating,
        where it ships from, listing count and a rough indexing time. Reads
        Discogs only; nothing is stored.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Seller preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerPreviewDto"
        "400":
          description: The username is empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Discogs has no user with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "502":
          description: Discogs failed while checking the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Discogs is unavailable (rate limit or server error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /sellers/{username}/index:
    post:
      operationId: startSellerIndexing
      summary: >
        Start (or re-trigger) indexing a Discogs seller's inventory. Fetches
        their full marketplace inventory and enriches each release, through
        the rate-limited Discogs request queue, in the background.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Indexing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexStartedDto"
        "400":
          description: The username is empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Discogs has no user with this name; nothing was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: Indexing is already running for this seller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "502":
          description: Discogs failed while checking the user; nothing was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Discogs is unavailable and being retried; nothing was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "504":
          description: Timed out waiting for Discogs to check the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /sellers/{username}:
    get:
      operationId: getSellerStatus
      summary: Get a seller's indexing status and progress
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Seller status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerStatusDto"
        "404":
          description: This username has never been indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
    delete:
      operationId: removeSeller
      summary: >
        Remove a seller: stop any indexing run for it and delete the seller, its inventory links,
        its scan passes and its queued jobs. Releases and fades are kept.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Seller removed
        "404":
          description: This username has never been indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /sellers/{username}/inventory:
    get:
      operationId: getSellerInventory
      summary: List a seller's active, indexed inventory (already-enriched releases only)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/StyleCombo"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
        - name: genre
          in: query
          description: Comma-separated genre names, OR-matched
          schema:
            type: string
        - name: style
          in: query
          description: Comma-separated style names, OR-matched
          schema:
            type: string
        - name: excludeGenre
          in: query
          description: Comma-separated genre names; releases with any of them are left out
          schema:
            type: string
        - name: excludeStyle
          in: query
          description: Comma-separated style names; releases with any of them are left out
          schema:
            type: string
        - name: excludeFormat
          in: query
          description: Comma-separated format names; releases with any of them are left out
          schema:
            type: string
        - name: onlyGenre
          in: query
          description: Comma-separated genre names; keeps releases whose genres are all in the list
          schema:
            type: string
        - name: onlyStyle
          in: query
          description: Comma-separated style names; keeps releases whose styles are all in the list
          schema:
            type: string
        - name: onlyFormat
          in: query
          description: Comma-separated format names; keeps releases whose formats are all in the list
          schema:
            type: string
        - name: format
          in: query
          description: Comma-separated format names (e.g. Vinyl, CD), OR-matched
          schema:
            type: string
        - name: country
          in: query
          description: Comma-separated country names, OR-matched
          schema:
            type: string
        - name: tracks
          in: query
          description: Comma-separated track counts, OR-matched; each is 1 to 6, or 7+ for seven or more
          schema:
            type: string
        - name: noLinks
          in: query
          description: "only keeps releases with no video links; exclude leaves them out"
          schema:
            type: string
            enum: [only, exclude]
        - name: yearMin
          in: query
          schema:
            type: integer
        - name: yearMax
          in: query
          schema:
            type: integer
        - $ref: "#/components/parameters/PriceMin"
        - $ref: "#/components/parameters/PriceMax"
        - $ref: "#/components/parameters/Currency"
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                title,
                -title,
                year,
                -year,
                artist,
                -artist,
                format,
                -format,
                rating,
                -rating,
                tracks,
                -tracks,
              ]
            default: title
      responses:
        "200":
          description: Paginated inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerInventoryPageDto"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /sellers/{username}/inventory/facets:
    get:
      operationId: getSellerInventoryFacets
      summary: >
        The genres, styles, format names and countries of a seller's active
        inventory, each with how many releases carry it, counted among the
        releases the same filters would list (faded ones excluded). Also the
        currencies the seller lists in and price buckets.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Genre"
        - $ref: "#/components/parameters/Style"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Tracks"
        - $ref: "#/components/parameters/ExcludeGenre"
        - $ref: "#/components/parameters/ExcludeStyle"
        - $ref: "#/components/parameters/ExcludeFormat"
        - $ref: "#/components/parameters/OnlyGenre"
        - $ref: "#/components/parameters/OnlyStyle"
        - $ref: "#/components/parameters/OnlyFormat"
        - $ref: "#/components/parameters/NoLinks"
        - $ref: "#/components/parameters/YearMin"
        - $ref: "#/components/parameters/YearMax"
        - $ref: "#/components/parameters/PriceMin"
        - $ref: "#/components/parameters/PriceMax"
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerInventoryFacetsDto"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

components:
  parameters:
    Genre:
      name: genre
      in: query
      description: Comma-separated genre names, OR-matched
      schema: { type: string }
    Style:
      name: style
      in: query
      description: Comma-separated style names, OR-matched
      schema: { type: string }
    Format:
      name: format
      in: query
      description: Comma-separated format names (e.g. Vinyl, CD), OR-matched
      schema: { type: string }
    Country:
      name: country
      in: query
      description: Comma-separated country names, OR-matched
      schema: { type: string }
    Tracks:
      name: tracks
      in: query
      description: Comma-separated track counts, OR-matched; each is 1 to 6, or 7+ for seven or more
      schema: { type: string }
    ExcludeGenre:
      name: excludeGenre
      in: query
      description: Comma-separated genre names; releases with any of them are left out
      schema: { type: string }
    ExcludeStyle:
      name: excludeStyle
      in: query
      description: Comma-separated style names; releases with any of them are left out
      schema: { type: string }
    ExcludeFormat:
      name: excludeFormat
      in: query
      description: Comma-separated format names; releases with any of them are left out
      schema: { type: string }
    OnlyGenre:
      name: onlyGenre
      in: query
      description: Comma-separated genre names; keeps releases whose genres are all in the list
      schema: { type: string }
    OnlyStyle:
      name: onlyStyle
      in: query
      description: Comma-separated style names; keeps releases whose styles are all in the list
      schema: { type: string }
    OnlyFormat:
      name: onlyFormat
      in: query
      description: Comma-separated format names; keeps releases whose formats are all in the list
      schema: { type: string }
    StyleCombo:
      name: styleCombo
      in: query
      description: >
        A style combination: comma-separated style names a release must all have.
        Repeat the parameter for several combinations; a release passes when it
        matches any one of them. Listing endpoints only; the facets ignore it, so
        counts do not follow combinations.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }
    NoLinks:
      name: noLinks
      in: query
      description: "only keeps releases with no video links; exclude leaves them out"
      schema:
        type: string
        enum: [only, exclude]
    YearMin:
      name: yearMin
      in: query
      schema: { type: integer }
    YearMax:
      name: yearMax
      in: query
      schema: { type: integer }
    PriceMin:
      name: priceMin
      in: query
      description: >
        Keeps releases with a listing priced at least this much, in `currency`
        (required with it). Seller endpoints only.
      schema: { type: number, minimum: 0 }
    PriceMax:
      name: priceMax
      in: query
      description: >
        Keeps releases with a listing priced at most this much, in `currency`
        (required with it). Seller endpoints only. Both ends together match one
        listing within the range.
      schema: { type: number, minimum: 0 }
    Currency:
      name: currency
      in: query
      description: >
        The currency of priceMin and priceMax. On the facets it also picks the
        currency of the price buckets (default: the seller's most common one).
        Prices are not converted: listings in other currencies never match.
      schema: { type: string, example: EUR }
  schemas:
    ErrorDto:
      type: object
      required: [error]
      properties:
        error:
          type: string

    IndexStartedDto:
      type: object
      required: [username, runId]
      properties:
        username: { type: string }
        runId: { type: string }

    SellerPreviewDto:
      type: object
      required:
        [
          username,
          avatarUrl,
          sellerRating,
          sellerNumRatings,
          shipsFromCountry,
          numForSale,
          marketplaceSuspended,
          estimatedSeconds,
        ]
      properties:
        username:
          type: string
          description: Under the casing Discogs reports.
        avatarUrl: { type: string, nullable: true }
        sellerRating:
          type: number
          nullable: true
          description: Seller rating as a percentage, e.g. 96.4; null for a seller who has never sold.
        sellerNumRatings: { type: integer, nullable: true }
        shipsFromCountry:
          type: string
          nullable: true
          description: From the seller's first listing; null when there is none or Discogs could not be asked.
        numForSale:
          type: integer
          description: Listings Discogs reports for the seller.
        marketplaceSuspended: { type: boolean }
        estimatedSeconds:
          type: integer
          description: Rough time a full indexing run takes at the Discogs request pace.

    SellerSummaryDto:
      type: object
      required: [username, lastIndexedAt, lastIndexStatus, forSaleCount, fadedCount, coverage]
      properties:
        username: { type: string }
        lastIndexedAt:
          type: string
          nullable: true
        lastIndexStatus:
          type: string
          enum: [never, running, success, error]
        forSaleCount:
          type: integer
          description: The seller's active, enriched items, faded ones included.
        fadedCount:
          type: integer
          description: How many of forSaleCount are faded for the user.
        coverage:
          type: object
          nullable: true
          description: Inventory items we can reach out of all the seller lists; null before the first scan.
          required: [reachable, total]
          properties:
            reachable: { type: integer }
            total: { type: integer }

    ReleaseFormatDto:
      type: object
      required: [name, descriptions]
      properties:
        name: { type: string }
        descriptions:
          type: array
          items: { type: string }

    ReleaseArtistDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    SellerStatusDto:
      type: object
      required:
        [
          username,
          lastIndexedAt,
          lastIndexStatus,
          currentlyRunning,
          totalReleasesFound,
          releasesEnriched,
          releasesFailed,
          sellerRating,
          sellerNumRatings,
          shipsFromCountry,
          avatarUrl,
          phase,
          scan,
          etaSeconds,
          retryingAt,
          backoffMs,
          coverage,
          scanPasses,
        ]
      properties:
        username: { type: string }
        lastIndexedAt:
          type: string
          nullable: true
        lastIndexStatus:
          type: string
          enum: [never, running, success, error]
        currentlyRunning: { type: boolean }
        totalReleasesFound: { type: integer }
        releasesEnriched: { type: integer }
        releasesFailed: { type: integer }
        sellerRating:
          type: number
          nullable: true
          description: Seller rating as a percentage, e.g. 96.4.
        sellerNumRatings: { type: integer, nullable: true }
        shipsFromCountry: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        phase:
          type: string
          enum: [scanning, enriching, done]
          description: scanning while inventory pages are fetched, enriching while releases are, done otherwise.
        scan:
          type: object
          nullable: true
          description: Inventory scan progress of the current run; null until page 1 is fetched.
          required: [pagesFetched, pagesTotal]
          properties:
            pagesFetched: { type: integer }
            pagesTotal: { type: integer }
        etaSeconds:
          type: integer
          nullable: true
          description: Seconds until enrichment finishes; null when unknown (too few releases enriched yet) or not enriching.
        retryingAt:
          type: string
          nullable: true
          description: When the paused Discogs queue retries (ISO); null while the queue is not paused.
        backoffMs: { type: integer, nullable: true }
        coverage:
          type: object
          nullable: true
          description: Distinct inventory items the current run has seen, out of all the seller lists. Discogs only serves the first 100 pages of an inventory per sort order, so reachable is lower than total for large sellers until further sort orders have run. Once the scan has read as many distinct listings as Discogs reports, total is the distinct item count (several copies of a release are one item), which can be lower than the listing count Discogs shows.
          required: [reachable, total]
          properties:
            reachable: { type: integer }
            total: { type: integer }
        scanPasses:
          type: array
          description: The sorted inventory passes of the current run, in the order they ran. Passes (each sort ascending, then descending) keep running until every inventory item has been seen or all of them have run.
          items:
            $ref: "#/components/schemas/ScanPassDto"

    ScanPassDto:
      type: object
      required:
        [sort, order, status, pagesPlanned, pagesFetched, itemsSeen, itemsNew, startedAt, endedAt]
      properties:
        sort: { type: string, enum: [artist, listed, label, catno, item, price, audio] }
        order: { type: string, enum: [asc, desc] }
        status:
          type: string
          enum: [running, done, capped, failed]
          description: capped means Discogs refused to paginate any further, so the pass ended cleanly. failed means a page kept failing, so the pass was abandoned and the scan moved on.
        pagesPlanned: { type: integer }
        pagesFetched: { type: integer }
        itemsSeen: { type: integer, description: Listings Discogs returned in this pass. }
        itemsNew: { type: integer, description: Inventory links this pass was the first of the run to see. }
        startedAt: { type: string }
        endedAt: { type: string, nullable: true }

    SellerInventoryItemDto:
      type: object
      required:
        [
          releaseId,
          title,
          thumb,
          year,
          country,
          genres,
          styles,
          formats,
          ratingAverage,
          ratingCount,
          haves,
          wants,
          artists,
          status,
          firstSeenAt,
          soldAt,
          listings,
        ]
      properties:
        releaseId: { type: integer }
        title: { type: string }
        thumb:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        country:
          type: string
          nullable: true
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        formats:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseFormatDto"
        ratingAverage:
          type: number
          nullable: true
        ratingCount:
          type: integer
          nullable: true
        haves:
          type: integer
          nullable: true
        wants:
          type: integer
          nullable: true
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseArtistDto"
        status:
          type: string
          enum: [active, sold]
        firstSeenAt: { type: string }
        soldAt:
          type: string
          nullable: true
        listings:
          type: array
          description: >
            Every listing of the release for this seller, cheapest first within
            a currency. Empty until the seller is next indexed.
          items:
            $ref: "#/components/schemas/ListingDto"

    ListingDto:
      type: object
      description: One copy of a release a seller has for sale.
      required: [id, mediaCondition, sleeveCondition, price, currency]
      properties:
        id: { type: integer, description: Discogs listing id. }
        mediaCondition: { type: string, example: Near Mint (NM or M-) }
        sleeveCondition:
          type: string
          nullable: true
        price: { type: number }
        currency:
          type: string
          description: Currency code as Discogs reports it; prices are not converted.
          example: EUR

    SellerInventoryPageDto:
      type: object
      required: [items, page, pageSize, total, forSaleCount, fadedCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SellerInventoryItemDto"
        page: { type: integer }
        pageSize: { type: integer }
        total:
          type: integer
          description: Items matching the current filters, faded ones excluded.
        forSaleCount:
          type: integer
          description: >
            The seller's active, enriched items, faded ones included. Ignores
            filters.
        fadedCount:
          type: integer
          description: How many of forSaleCount are faded for the user. Ignores filters.

    ReleaseListItemDto:
      type: object
      description: A SellerInventoryItemDto without the seller-specific status, firstSeenAt and soldAt.
      required:
        [releaseId, title, thumb, year, country, genres, styles, formats, ratingAverage, ratingCount, haves, wants, artists]
      properties:
        releaseId: { type: integer }
        title: { type: string }
        thumb: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        country: { type: string, nullable: true }
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        formats:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseFormatDto"
        ratingAverage: { type: number, nullable: true }
        ratingCount: { type: integer, nullable: true }
        haves: { type: integer, nullable: true }
        wants: { type: integer, nullable: true }
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseArtistDto"

    ReleaseListPageDto:
      type: object
      required: [items, page, pageSize, total, enrichedCount, fadedCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseListItemDto"
        page: { type: integer }
        pageSize: { type: integer }
        total:
          type: integer
          description: Releases matching the current filters, faded ones excluded.
        enrichedCount:
          type: integer
          description: All enriched releases, faded ones included. Ignores filters.
        fadedCount:
          type: integer
          description: How many of enrichedCount are faded for the user. Ignores filters.

    FacetValueDto:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count:
          type: integer
          description: How many of the releases matching the filters carry the value.

    ReleaseFacetsDto:
      type: object
      description: >
        The values of each category among the releases matching the filters, most
        common first (ties alphabetical). Values no matching release carries are left out.
      required: [genres, styles, formats, countries]
      properties:
        genres:
          type: array
          items: { $ref: "#/components/schemas/FacetValueDto" }
        styles:
          type: array
          items: { $ref: "#/components/schemas/FacetValueDto" }
        formats:
          type: array
          items: { $ref: "#/components/schemas/FacetValueDto" }
        countries:
          type: array
          items: { $ref: "#/components/schemas/FacetValueDto" }

    PriceCurrencyDto:
      type: object
      required: [currency, count]
      properties:
        currency:
          type: string
          example: EUR
        count:
          type: integer
          description: How many of the seller's releases have a listing in the currency.

    PriceBucketDto:
      type: object
      description: >
        A price range, inclusive at both ends, so it can be sent as priceMin and
        priceMax. A bucket ends one cent below the start of the next.
      required: [min, max, count]
      properties:
        min:
          type: number
          nullable: true
          description: Null for the first bucket, which has no lower end.
        max:
          type: number
          nullable: true
          description: Null for the last bucket, which has no upper end.
        count:
          type: integer
          description: >
            How many releases matching every filter but price have a listing in the
            range.

    SellerInventoryFacetsDto:
      allOf:
        - $ref: "#/components/schemas/ReleaseFacetsDto"
        - type: object
          required: [currencies, currency, priceBuckets]
          properties:
            currencies:
              type: array
              description: >
                Every currency the seller has active listings in, most common first.
                Ignores the filters.
              items: { $ref: "#/components/schemas/PriceCurrencyDto" }
            currency:
              type: string
              nullable: true
              description: >
                The currency of priceBuckets: the currency param, else the most common
                one. Null when the seller has no listings.
            priceBuckets:
              type: array
              description: >
                Up to six price ranges in `currency` with 1-2-5 boundaries from the
                seller's whole inventory, counted among the releases matching every
                filter but price.
              items: { $ref: "#/components/schemas/PriceBucketDto" }

    FadeRequestDto:
      type: object
      description: Provide exactly one of releaseId or masterId.
      properties:
        releaseId:
          type: integer
        masterId:
          type: integer

    FadeResponseDto:
      type: object
      required: [kind, id, lookupStatus, title, artists, versionCount]
      properties:
        kind:
          type: string
          enum: [master, release]
        id:
          type: integer
        lookupStatus:
          type: string
          enum: [pending, done, failed]
          description: >
            pending until the master and its versions are known, done once they
            are (or the release has no master), failed when Discogs could not
            resolve it.
        title:
          type: string
          nullable: true
          description: The title of the faded release or master, when known.
        artists:
          type: array
          items: { $ref: "#/components/schemas/ReleaseArtistStub" }
        versionCount:
          type: integer
          nullable: true
          description: >
            Releases the fade hides: the master's versions, or 1 for a release
            without a master. Null unless lookupStatus is done.

    SettingsDto:
      type: object
      required: [theme]
      properties:
        theme:
          type: string
          enum: [light, dark]
          description: The colour theme of the app. Dark until the user picks light.

    UpdateSettingsRequestDto:
      type: object
      description: Any subset of SettingsDto.
      properties:
        theme:
          type: string
          enum: [light, dark]

    FadedItemDto:
      type: object
      required: [kind, id, fadedAt, title, artists, year, thumb, versionsIndexed, lookupStatus]
      properties:
        kind:
          type: string
          enum: [master, release]
        id:
          type: integer
          description: The master id or release id, as stored; send it back to unfade.
        fadedAt:
          type: string
          format: date-time
        title:
          type: string
          nullable: true
          description: >
            Of the lowest-id indexed release the fade hides, else the title
            Discogs gave when the fade was looked up; null if neither is known.
        artists:
          type: array
          items: { $ref: "#/components/schemas/ReleaseArtistStub" }
        year:
          type: integer
          nullable: true
        thumb:
          type: string
          nullable: true
        versionsIndexed:
          type: integer
          description: Indexed releases the fade hides; 0 when none is indexed.
        lookupStatus:
          type: string
          enum: [pending, done, failed]
          description: Where the fade's Discogs lookup stands; failed when Discogs could not resolve it.

    FadedItemsDto:
      type: object
      required: [items, page, pageSize, total, fadedTotal]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FadedItemDto" }
        page: { type: integer }
        pageSize: { type: integer }
        total:
          type: integer
          description: Fades matching the search.
        fadedTotal:
          type: integer
          description: All of the collector's fades, ignoring the search.

    FadedIdsDto:
      type: object
      required: [masterIds, releaseIds, versionReleaseIds, failedLookups]
      properties:
        masterIds:
          type: array
          items: { type: integer }
        releaseIds:
          type: array
          items: { type: integer }
        versionReleaseIds:
          type: array
          items: { type: integer }
          description: Release ids under the faded masters, as far as their lookups have run.
        failedLookups:
          type: array
          description: Fades Discogs could not resolve. They stay in place; fading again retries.
          items:
            type: object
            required: [kind, id]
            properties:
              kind:
                type: string
                enum: [master, release]
              id:
                type: integer

    Artist:
      type: object
      required: [id, name, resource_url]
      properties:
        id: { type: integer }
        name: { type: string }
        anv: { type: string }
        join: { type: string }
        role: { type: string }
        tracks: { type: string }
        resource_url: { type: string }
        thumbnail_url: { type: string }

    Label:
      type: object
      required: [id, name, resource_url]
      properties:
        id: { type: integer }
        name: { type: string }
        catno: { type: string }
        entity_type: { type: string }
        entity_type_name: { type: string }
        resource_url: { type: string }
        thumbnail_url: { type: string }

    Company:
      $ref: "#/components/schemas/Label"

    Format:
      type: object
      required: [name]
      properties:
        name: { type: string }
        qty: { type: string }
        text: { type: string }
        descriptions:
          type: array
          items: { type: string }

    Identifier:
      type: object
      required: [type, value]
      properties:
        type: { type: string }
        value: { type: string }
        description: { type: string }

    Video:
      type: object
      required: [uri]
      properties:
        uri: { type: string }
        title: { type: string }
        description: { type: string }
        duration: { type: integer }
        embed: { type: boolean }

    Track:
      type: object
      required: [position, title]
      properties:
        position: { type: string }
        type_: { type: string }
        title: { type: string }
        duration: { type: string }
        extraartists:
          type: array
          items:
            $ref: "#/components/schemas/Artist"

    Image:
      type: object
      required: [type, uri, resource_url]
      properties:
        type: { type: string }
        uri: { type: string }
        resource_url: { type: string }
        uri150: { type: string }
        width: { type: integer }
        height: { type: integer }

    CommunityUser:
      type: object
      required: [username, resource_url]
      properties:
        username: { type: string }
        resource_url: { type: string }

    Community:
      type: object
      properties:
        have: { type: integer }
        want: { type: integer }
        rating:
          type: object
          properties:
            count: { type: integer }
            average: { type: number }
        submitter:
          $ref: "#/components/schemas/CommunityUser"
        contributors:
          type: array
          items:
            $ref: "#/components/schemas/CommunityUser"
        data_quality: { type: string }
        status: { type: string }

    ReleaseDetailDto:
      type: object
      description: >
        Served from our own database (fetched live from Discogs and saved on
        first request if the release is not indexed yet).
      required: [id, title, year, country, artists, tracklist, videos]
      properties:
        id: { type: integer }
        title: { type: string }
        thumb: { type: string }
        year: { type: integer, nullable: true }
        country: { type: string, nullable: true }
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseArtistStub"
        tracklist:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseTrack"
        videos:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseVideo"

    ReleaseArtistStub:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    ReleaseTrack:
      type: object
      required: [position, title]
      properties:
        position: { type: string }
        title: { type: string }
        duration: { type: string }

    ReleaseVideo:
      type: object
      required: [uri]
      properties:
        uri: { type: string }
        title: { type: string }
        duration: { type: integer }

    MasterDetailDto:
      type: object
      required: [id, resource_url, artists, title]
      properties:
        id: { type: integer }
        main_release: { type: integer }
        most_recent_release: { type: integer }
        resource_url: { type: string }
        uri: { type: string }
        versions_url: { type: string }
        main_release_url: { type: string }
        most_recent_release_url: { type: string }
        num_for_sale: { type: integer }
        lowest_price: { type: number }
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        year: { type: integer }
        tracklist:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
        title: { type: string }
        data_quality: { type: string }
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
