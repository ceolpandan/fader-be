openapi: 3.0.3
info:
  title: discogs-fade-backend
  version: 0.1.0
  description: >
    Boundary between the extension and Discogs' API. Wraps GET /masters/{id} and
    GET and POST /fade — master DTOs are currently unscoped (all Discogs response
    fields kept as-is). GET /releases/{id} serves a trimmed release from our
    own database, and GET /releases lists and filters the releases stored there.
paths:
  /releases:
    get:
      operationId: listReleases
      summary: List every release
      description: >
        Pages, filters and sorts the stored releases; 400 on invalid input.
        Releases the user has faded (directly or through their master) are
        left out of items and total, and so are releases an enrichment run
        found Discogs no longer has. Sorting by rating puts releases that were
        never enriched last in either direction.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50 }
        - $ref: "#/components/parameters/StyleCombo"
        - $ref: "#/components/parameters/OnlyStyleCombo"
        - $ref: "#/components/parameters/ExcludeStyleCombo"
        - name: genre
          in: query
          description: Comma-separated genre names, OR-matched
          schema:
            type: string
        - name: style
          in: query
          description: Comma-separated style names, OR-matched
          schema:
            type: string
        - name: format
          in: query
          description: Comma-separated format names (e.g. Vinyl, CD), OR-matched
          schema:
            type: string
        - name: country
          in: query
          description: Comma-separated country names, OR-matched
          schema:
            type: string
        - name: excludeCountry
          in: query
          description: Comma-separated country names; releases from any of them are left out (releases with no country stay)
          schema:
            type: string
        - name: tracks
          in: query
          description: Comma-separated track counts, OR-matched; each is 1 to 6, or 7+ for seven or more
          schema:
            type: string
        - name: excludeGenre
          in: query
          description: Comma-separated genre names; releases with any of them are left out
          schema:
            type: string
        - name: excludeStyle
          in: query
          description: Comma-separated style names; releases with any of them are left out
          schema:
            type: string
        - name: excludeFormat
          in: query
          description: Comma-separated format names; releases with any of them are left out
          schema:
            type: string
        - name: onlyGenre
          in: query
          description: Comma-separated genre names; keeps releases whose genres are all in the list
          schema:
            type: string
        - name: onlyStyle
          in: query
          description: Comma-separated style names; keeps releases whose styles are all in the list
          schema:
            type: string
        - name: onlyFormat
          in: query
          description: Comma-separated format names; keeps releases whose formats are all in the list
          schema:
            type: string
        - name: noLinks
          in: query
          description: "only keeps releases with no video links; exclude leaves them out"
          schema:
            type: string
            enum: [only, exclude]
        - name: yearMin
          in: query
          schema: { type: integer }
        - name: yearMax
          in: query
          schema: { type: integer }
        - name: ratingCountMin
          in: query
          description: >
            At least this many collectors have rated the release on Discogs. The count is only known
            for enriched releases, so this leaves out the rest.
          schema: { type: integer, minimum: 0 }
        - name: ratingMin
          in: query
          description: >
            The average rating on Discogs is at least this, from 0 to 5. The rating is only known
            for enriched releases, so this leaves out the rest.
          schema: { type: number, minimum: 0, maximum: 5 }
        - name: haveMax
          in: query
          description: >
            At most this many collectors have the release on Discogs. Haves, wants and the ratio are
            only known for enriched releases, so using any of the three leaves the others out.
          schema: { type: integer, minimum: 0 }
        - name: wantMin
          in: query
          description: At least this many collectors want the release on Discogs.
          schema: { type: integer, minimum: 0 }
        - name: wantRatioMin
          in: query
          description: >
            At least this many wants per have (wants / max(haves, 1)), so 3 keeps releases wanted
            three times as often as they are had.
          schema: { type: number, exclusiveMinimum: 0 }
        - name: q
          in: query
          description: >
            Search text, at most 200 characters. Every word must be in the title
            or in one of the artist names, in any case.
          schema: { type: string, maxLength: 200 }
        - name: scrape
          in: query
          description: >
            Only releases one of the user's own scrapes matched, by scrape id. A scrape that does
            not exist, or belongs to another user, matches nothing.
          schema: { type: integer }
        - name: sort
          in: query
          description: >
            -rarity ranks by wants per have (wants / max(haves, 1)), the most wanted first, and has no
            ascending order. Releases with no haves and wants known, or with more haves than the
            user's rarityHaveMax setting, come last.
          schema:
            type: string
            enum:
              [title, -title, year, -year, artist, -artist, format, -format, rating, -rating, tracks, -tracks, versions, -versions, -rarity]
            default: title
      responses:
        "200":
          description: Paginated releases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseListPageDto"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /releases/filter-options:
    get:
      operationId: getReleaseFilterOptions
      summary: >
        The genres, styles, format names and countries the filter dialog offers,
        each list most common first. Built when the catalogue is imported, so it
        does not follow filters, fades or enrichment and carries no counts.
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseFilterOptionsDto"
  /releases/{id}:
    get:
      operationId: getRelease
      summary: >
        Get a release by id from our database. 404 when it is not stored.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Release found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetailDto"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /releases/{id}/refresh:
    post:
      operationId: refreshRelease
      summary: Fetch one release from Discogs now and return it
      description: >
        Fetches the release with the signed-in user's own Discogs token, ahead
        of any queued enrichment run, and overwrites what is stored for it,
        rating included. A release Discogs no longer has is marked missing
        (Explore hides it) and answers 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The refreshed release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetailDto"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Discogs does not have the release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: >
            The user has no Discogs token, or Discogs rejected it (code
            token_required).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "502":
          description: Discogs fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Discogs is erroring and the user's queue is paused; try again shortly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "504":
          description: Timed out waiting for the Discogs fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /enrichment/preview:
    get:
      operationId: previewEnrichmentRun
      summary: What an enrichment run would do for a filter
      description: >
        Counts the releases the filter shows the user that a run would fetch
        from Discogs, and those it would leave alone (faded ones, and, unless
        fresh, already enriched or missing ones; releases another run has
        queued). max is the most releases one run may fetch.
      parameters:
        - name: query
          in: query
          description: The Explore query string, without page.
          schema: { type: string }
        - name: fresh
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentPreviewDto"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /enrichment/run:
    get:
      operationId: getEnrichmentRun
      summary: The user's active enrichment run, or their last one
      description: >
        Only the latest run is kept. run is null before the user ever started
        one. Poll it for progress.
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentStatusDto"
    post:
      operationId: startEnrichmentRun
      summary: Fetch the releases a filter shows from Discogs, for their rating
      description: >
        Queues one fetch per release the filter shows the user that is not
        faded, not already enriched (unless fresh) and not already queued by
        another run, at one request per 1.1 seconds on the user's own token.
        Replaces the user's last finished run. While the user has an active
        run, the releases are added to it (behind the ones already queued) and
        that run is returned with its total grown; it keeps the query it
        started with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartEnrichmentRunRequestDto"
      responses:
        "201":
          description: The run was started (or finished at once when nothing needed fetching)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentRunDto"
        "400":
          description: Invalid query or body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: >
            The user has no Discogs token (code token_required). Nothing is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "422":
          description: >
            More releases to fetch than the server allows in one run (code
            too_many_releases). Nothing is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /enrichment/run/cancel:
    post:
      operationId: cancelEnrichmentRun
      summary: Stop the active enrichment run
      description: Drops the fetches not started yet; the one in flight finishes.
      responses:
        "200":
          description: The cancelled run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentRunDto"
        "409":
          description: No run is active (code no_active_run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /fade:
    get:
      operationId: getFades
      summary: List what the signed-in user has faded
      description: >
        Faded masters and releases without a master. A release is hidden when
        its own id is in releaseIds or its master id is in masterIds, which
        also covers versions added to a faded master later. versionReleaseIds
        lists the versions of the faded masters found so far, and
        failedLookups the fades Discogs could not resolve.
      responses:
        "200":
          description: Faded ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FadedIdsDto"
    post:
      operationId: fade
      summary: >
        Fade a release or a master for the signed-in user. Any release or
        master can be faded, indexed or not. A release with a known master is
        stored as that master, hiding every version under it. Any other
        release is stored as itself, and a lookup upgrades it to its master and stores the master's
        versions. The request waits for that lookup (up to about 20 seconds),
        so the answer names the fade and counts what it hides. If the wait
        runs out, or Discogs is paused, lookupStatus is pending, versionCount
        is null and the lookup carries on in the background. Fading a failed
        fade again retries its lookup. Otherwise idempotent. A fade that needs
        a Discogs lookup uses the signed-in user's own Discogs token, so
        without one it is refused with 409 and nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FadeRequestDto"
      responses:
        "200":
          description: Fade stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FadeResponseDto"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: >
            The fade needs a Discogs lookup and the user has no Discogs token
            (code token_required). Nothing is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
    delete:
      operationId: unfade
      summary: >
        Unfade a release or a master for the signed-in user. A release with a
        master unfades that master and every version under it. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FadeRequestDto"
      responses:
        "204":
          description: Fade removed, or there was none
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /fade/items:
    get:
      operationId: getFadedItems
      summary: Page through what the signed-in user has faded
      description: >
        One row per stored fade (a master, or a release without a master),
        newest first, each with the lowest-id indexed release it hides.
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: >
            Case-insensitive substring of a title or artist name of any indexed
            release the fade hides.
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, default: 50 }
      responses:
        "200":
          description: A page of fades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FadedItemsDto"
        "400":
          description: Invalid page or pageSize
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /saved-filters:
    get:
      operationId: listSavedFilters
      summary: The signed-in user's saved Explore filters
      description: In the order they were saved, oldest first.
      responses:
        "200":
          description: Saved filters
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SavedFilterDto" }
    post:
      operationId: createSavedFilter
      summary: Save an Explore filter
      description: >
        Stores the filter under the given name. A user can save any number of
        filters, but each query only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavedFilterRequestDto"
      responses:
        "201":
          description: The saved filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedFilterDto"
        "400":
          description: The name or query is empty or too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: The user already saved this query; nothing is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /saved-filters/{id}:
    patch:
      operationId: renameSavedFilter
      summary: Rename a saved filter
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSavedFilterRequestDto"
      responses:
        "200":
          description: The saved filter after the rename
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedFilterDto"
        "400":
          description: The name is empty or too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: No such saved filter for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
    delete:
      operationId: deleteSavedFilter
      summary: Delete a saved filter
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: No such saved filter for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /scrapes:
    get:
      operationId: listScrapes
      summary: The signed-in user's scrapes
      description: In the order they were uploaded, oldest first.
      responses:
        "200":
          description: Scrapes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScrapeDto" }
    post:
      operationId: createScrape
      summary: Upload a scrape
      description: >
        Takes a named list of `Artist - Title` lines (one per line, split on the first " - ") and
        matches each line to the releases whose artist and title are the same after ignoring case,
        accents, punctuation, "&" versus "and", a leading "The" and a Discogs disambiguation
        number. A line that fits several pressings takes all of them. The answer comes when the
        matching is done, which takes several seconds. Blank lines and repeated lines are ignored.
        When the user has a Discogs token, a Discogs search is then queued for each line that
        matched nothing (see `searchScrapeUnmatched`); it finishes after the answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScrapeRequestDto"
      responses:
        "201":
          description: The scrape, with what it matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeDto"
        "400":
          description: The name is empty or too long, or the text is missing, empty, over 512 KB or over 5000 distinct lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: The user already has a scrape with this name; nothing is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /scrapes/{id}:
    patch:
      operationId: renameScrape
      summary: Rename a scrape
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameScrapeRequestDto"
      responses:
        "200":
          description: The scrape after the rename
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeDto"
        "400":
          description: The name is empty or too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: No such scrape for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: The user already has another scrape with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
    delete:
      operationId: deleteScrape
      summary: Delete a scrape
      description: Removes the scrape with its matches and unmatched lines; the releases stay.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: No such scrape for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /scrapes/{id}/unmatched:
    get:
      operationId: getScrapeUnmatched
      summary: The lines of a scrape that matched no release
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The unmatched lines (those not matched or attached by hand), as uploaded and in file order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeUnmatchedDto"
        "404":
          description: No such scrape for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /scrapes/{id}/search:
    post:
      operationId: searchScrapeUnmatched
      summary: Search Discogs for a scrape's unmatched lines
      description: >
        Queues one Discogs search per line (the line as written, with special characters other
        than apostrophes removed), behind inline requests and ahead of enrichment, with the user's
        own token. The first release Discogs returns links to the line; one the catalogue lacks is
        fetched first. A scrape upload queues these searches itself when the user has a token.
        Lines already queued, matched or rejected are left alone. The answer comes at once;
        progress is `searchingCount` on the scrape.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchScrapeRequestDto"
      responses:
        "200":
          description: How many searches were queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchScrapeResponseDto"
        "400":
          description: positions is not a list of integers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: No such scrape for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: The user has no Discogs token (code token_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /scrapes/{id}/search-matches:
    get:
      operationId: getScrapeSearchMatches
      summary: The lines the Discogs search matched
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The matched lines in file order, with the release each was linked to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeSearchMatchesDto"
        "404":
          description: No such scrape for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /scrapes/{id}/search-matches/commit:
    post:
      operationId: commitScrapeSearchMatches
      summary: Confirm every searched match of a scrape
      description: Clears the marker of all of them. Committed or not, a match filters and enriches the same.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The scrape with its new counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeDto"
        "404":
          description: No such scrape for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /scrapes/{id}/search-matches/{position}/commit:
    post:
      operationId: commitScrapeSearchMatch
      summary: Confirm one searched match
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: position
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The scrape with its new counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeDto"
        "404":
          description: No such scrape for this user, or no searched match at that line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /scrapes/{id}/search-matches/{position}/unlink:
    post:
      operationId: unlinkScrapeSearchMatch
      summary: Take a searched match back
      description: >
        The line returns to the unmatched list as rejected, so it is not searched again, and the
        release leaves the scrape unless another line still holds it or the line's own matching
        found it.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: position
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The scrape with its new counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeDto"
        "404":
          description: No such scrape for this user, or no searched match at that line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /scrapes/{id}/unmatched/{position}/attach:
    post:
      operationId: attachScrapeRelease
      summary: Attach a release to an unmatched line by hand
      description: >
        The line leaves the unmatched list and the release joins the scrape's releases (a release
        the scrape already holds is not added twice). A release the catalogue lacks, or has flagged
        missing (Discogs no longer had it), is first fetched from Discogs, ahead of any queued run and with the user's own token, and stored; if Discogs
        has no such release, nothing is stored and the line stays unmatched. The answer comes when
        that fetch is done.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: position
          required: true
          description: The line's position, as the unmatched list gives it.
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachReleaseRequestDto"
      responses:
        "200":
          description: The scrape with its new counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeDto"
        "400":
          description: releaseId is not a positive integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: >
            No such scrape for this user, no such unmatched line, or (code release_not_found)
            Discogs has no such release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: The release is not in the catalogue and the user has no Discogs token, or Discogs rejected it (code token_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "502":
          description: Fetching the release from Discogs failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Discogs is unavailable and retrying; try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "504":
          description: Timed out waiting for Discogs; the fetch is still queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /me/discogs-profile:
    get:
      operationId: getDiscogsProfile
      summary: The signed-in user's cached Discogs profile and sync state
      description: >
        What the last fetch or sync got from Discogs with the user's saved
        token: username, collection and wantlist counts, and when the last
        sync completed. `sync` says whether a sync is queued or running, or
        failed. Nothing is fetched here; `profile` is null until the first
        fetch and whenever there is no token.
      responses:
        "200":
          description: The cached profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscogsProfileDto"
  /me/discogs-profile/counts:
    post:
      operationId: fetchDiscogsCounts
      summary: Fetch the collection and wantlist counts, without syncing
      description: >
        Fills the home card, and the first sync's confirmation, before
        anything is hidden. Queues the fetch like every other Discogs request,
        ahead of any job, and waits for it. It asks Discogs with the user's
        saved token and replaces the cached counts; `lastSyncedAt` is kept. A
        failed fetch leaves the cached profile as it was.
      responses:
        "200":
          description: The profile as just fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscogsProfileDto"
        "400":
          description: Discogs did not accept the saved token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: The user has no Discogs token saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "502":
          description: Discogs failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Discogs is erroring and the queue is waiting it out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "504":
          description: >
            The queue did not get to the fetch in time; it still runs, and the
            cached profile updates once it has
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /me/discogs-profile/refresh:
    post:
      operationId: refreshDiscogsProfile
      summary: Sync the signed-in user's Discogs collection and wantlist
      description: >
        Starts the sync and answers at once; poll `GET /me/discogs-profile`
        until `sync.status` is `idle` (done) or `failed`. One job at
        queue priority 5 pages the wantlist, then the collection, with the
        user's saved token and writes nothing until every page is in. Then, in
        one transaction, it mirrors both lists (`collection_items`,
        `wantlist_items`), hides every release on either list
        (`hidden_releases`), deletes the release fade on each, and fades the
        master of each (once, unless the user already faded it) with a
        lookup that fades the other versions. A release that left both lists
        loses its hidden row; the master fade stays. A failed sync leaves the
        previous data as it was. A sync already queued or running is not
        started twice. The UI asks for confirmation first while
        `lastSyncedAt` is null.
      responses:
        "202":
          description: The sync is queued or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscogsProfileDto"
        "409":
          description: The user has no Discogs token saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /settings/discogs-token:
    get:
      operationId: getDiscogsToken
      summary: Whether the signed-in user has a Discogs token stored
      description: The token itself is never returned.
      responses:
        "200":
          description: Token status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscogsTokenDto"
    put:
      operationId: setDiscogsToken
      summary: Store the signed-in user's Discogs personal access token
      description: >
        Checks the token with Discogs (GET /oauth/identity) and, when Discogs
        accepts it, stores it encrypted, replacing any earlier one. The token
        can never be read back, only replaced or removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDiscogsTokenRequestDto"
      responses:
        "200":
          description: The token is stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscogsTokenDto"
        "400":
          description: The token is empty, too long, or Discogs did not accept it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "502":
          description: Discogs could not be reached to check the token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: The server has no TOKEN_ENCRYPTION_KEY, so it cannot store tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
    delete:
      operationId: deleteDiscogsToken
      summary: Remove the signed-in user's Discogs token
      description: Succeeds whether or not a token was stored.
      responses:
        "204":
          description: No token is stored any more
  /settings:
    get:
      operationId: getSettings
      summary: The signed-in user's settings
      description: >
        A setting the user never changed holds its default, so a user with no
        stored settings gets them all.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDto"
    patch:
      operationId: updateSettings
      summary: Change some of the signed-in user's settings
      description: >
        Takes any subset of the settings; the ones left out stay as they are.
        An empty body changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequestDto"
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDto"
        "400":
          description: A setting holds a value it does not allow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /masters/{id}:
    get:
      operationId: getMaster
      summary: Get a master release by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Master found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDetailDto"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Master not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: The user has no Discogs token, or Discogs rejected it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
components:
  parameters:
    Genre:
      name: genre
      in: query
      description: Comma-separated genre names, OR-matched
      schema: { type: string }
    Style:
      name: style
      in: query
      description: Comma-separated style names, OR-matched
      schema: { type: string }
    Format:
      name: format
      in: query
      description: Comma-separated format names (e.g. Vinyl, CD), OR-matched
      schema: { type: string }
    Country:
      name: country
      in: query
      description: Comma-separated country names, OR-matched
      schema: { type: string }
    ExcludeCountry:
      name: excludeCountry
      in: query
      description: Comma-separated country names; releases from any of them are left out (releases with no country stay)
      schema: { type: string }
    Tracks:
      name: tracks
      in: query
      description: Comma-separated track counts, OR-matched; each is 1 to 6, or 7+ for seven or more
      schema: { type: string }
    ExcludeGenre:
      name: excludeGenre
      in: query
      description: Comma-separated genre names; releases with any of them are left out
      schema: { type: string }
    ExcludeStyle:
      name: excludeStyle
      in: query
      description: Comma-separated style names; releases with any of them are left out
      schema: { type: string }
    ExcludeFormat:
      name: excludeFormat
      in: query
      description: Comma-separated format names; releases with any of them are left out
      schema: { type: string }
    OnlyGenre:
      name: onlyGenre
      in: query
      description: Comma-separated genre names; keeps releases whose genres are all in the list
      schema: { type: string }
    OnlyStyle:
      name: onlyStyle
      in: query
      description: Comma-separated style names; keeps releases whose styles are all in the list
      schema: { type: string }
    OnlyFormat:
      name: onlyFormat
      in: query
      description: Comma-separated format names; keeps releases whose formats are all in the list
      schema: { type: string }
    StyleCombo:
      name: styleCombo
      in: query
      description: >
        A style combination: comma-separated style names a release must all have.
        Repeat the parameter for several combinations; a release passes when it
        matches any one of them.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }
    OnlyStyleCombo:
      name: onlyStyleCombo
      in: query
      description: >
        Like styleCombo, but the release must have exactly those styles and no others. Repeat
        the parameter for several combinations; a release passes when it matches any one of them.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }
    ExcludeStyleCombo:
      name: excludeStyleCombo
      in: query
      description: >
        A style combination to leave out: releases that have every one of these styles are
        dropped. Repeat the parameter for several combinations; a release must match none.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }
    NoLinks:
      name: noLinks
      in: query
      description: "only keeps releases with no video links; exclude leaves them out"
      schema:
        type: string
        enum: [only, exclude]
    YearMin:
      name: yearMin
      in: query
      schema: { type: integer }
    YearMax:
      name: yearMax
      in: query
      schema: { type: integer }
  schemas:
    ErrorDto:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: A stable machine-readable reason, set only where documented (for example token_required).

    ReleaseFormatDto:
      type: object
      required: [name, descriptions]
      properties:
        name: { type: string }
        descriptions:
          type: array
          items: { type: string }

    ReleaseArtistDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    ReleaseListItemDto:
      type: object
      required:
        [releaseId, title, year, country, genres, styles, formats, ratingAverage, ratingCount, artists, labels, versionCount]
      properties:
        releaseId: { type: integer }
        title: { type: string }
        year: { type: integer, nullable: true }
        country: { type: string, nullable: true }
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        formats:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseFormatDto"
        ratingAverage:
          type: number
          nullable: true
          description: Discogs community rating; null until an enrichment run has fetched the release.
        ratingCount: { type: integer, nullable: true }
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseArtistDto"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseLabelDto"
        versionCount:
          type: integer
          minimum: 1
          description: Stored releases under the same master, this one included (1 without a master). What fading its master clears.

    ReleaseLabelDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        catno: { type: string }

    ReleaseListPageDto:
      type: object
      required: [items, page, pageSize, total, fadedCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseListItemDto"
        page: { type: integer }
        pageSize: { type: integer }
        total:
          type: integer
          description: Releases matching the current filters, faded ones excluded.
        fadedCount:
          type: integer
          description: How many releases the user has faded. Ignores filters.

    ReleaseFilterOptionsDto:
      type: object
      description: The values of each category, most common first.
      required: [genres, styles, formats, countries]
      properties:
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        formats:
          type: array
          items: { type: string }
        countries:
          type: array
          items: { type: string }

    FadeRequestDto:
      type: object
      description: Provide exactly one of releaseId or masterId.
      properties:
        releaseId:
          type: integer
        masterId:
          type: integer

    FadeResponseDto:
      type: object
      required: [kind, id, lookupStatus, title, artists, versionCount]
      properties:
        kind:
          type: string
          enum: [master, release]
        id:
          type: integer
        lookupStatus:
          type: string
          enum: [pending, done, failed]
          description: >
            pending until the master and its versions are known, done once they
            are (or the release has no master), failed when Discogs could not
            resolve it.
        title:
          type: string
          nullable: true
          description: The title of the faded release or master, when known.
        artists:
          type: array
          items: { $ref: "#/components/schemas/ReleaseArtistStub" }
        versionCount:
          type: integer
          nullable: true
          description: >
            Releases the fade hides: the master's versions, or 1 for a release
            without a master. Null unless lookupStatus is done.

    SavedFilterDto:
      type: object
      required: [id, name, query, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        query:
          type: string
          description: >
            The Explore URL query without page and without a leading "?"; apply
            it by opening /explore?query.
        createdAt: { type: string, format: date-time }

    CreateSavedFilterRequestDto:
      type: object
      required: [name, query]
      properties:
        name:
          type: string
          maxLength: 200
          description: Trimmed; must not be empty.
        query:
          type: string
          maxLength: 4000
          description: Must not be empty. A leading "?" is dropped.

    RenameSavedFilterRequestDto:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
          description: Trimmed; must not be empty.

    ScrapeDto:
      type: object
      required: [id, name, createdAt, releaseCount, unmatchedCount, searchingCount, uncommittedMatchCount]
      properties:
        id: { type: integer }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        releaseCount:
          type: integer
          description: Distinct releases the lines matched.
        unmatchedCount:
          type: integer
          description: Lines that matched no release.
        searchingCount:
          type: integer
          description: Lines whose Discogs search is queued or waiting on a release fetch.
        uncommittedMatchCount:
          type: integer
          description: Lines the Discogs search matched that the user has not committed yet; they carry a marker until then.

    CreateScrapeRequestDto:
      type: object
      required: [name, text]
      properties:
        name:
          type: string
          maxLength: 200
          description: Trimmed; must not be empty and must not be one of the user's scrape names.
        text:
          type: string
          description: The file's text, at most 512 KB; one "Artist - Title" per line, at most 5000 distinct lines.

    RenameScrapeRequestDto:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
          description: Trimmed; must not be empty.

    ScrapeUnmatchedDto:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/ScrapeUnmatchedLineDto" }

    ScrapeUnmatchedLineDto:
      type: object
      required: [position, line, searchStatus]
      properties:
        position:
          type: integer
          description: The line's place in the upload; it names the line when attaching a release to it.
        line: { type: string }
        searchStatus:
          type: string
          nullable: true
          enum: [queued, fetching, no_result, failed, rejected]
          description: >
            Where the Discogs search for the line stands: queued or fetching while it runs, no_result
            when Discogs found nothing, failed when it could not finish, rejected when the user
            took a match back. Null when the line was never searched.

    SearchScrapeRequestDto:
      type: object
      properties:
        positions:
          type: array
          items: { type: integer }
          description: >
            The lines to search. Omitted, every unmatched line that was not searched yet, found
            nothing or failed.

    SearchScrapeResponseDto:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer
          description: How many searches were queued.

    ScrapeSearchMatchesDto:
      type: object
      required: [matches]
      properties:
        matches:
          type: array
          items: { $ref: "#/components/schemas/ScrapeSearchMatchDto" }

    ScrapeSearchMatchDto:
      type: object
      required: [position, line, releaseId, title, artists, committed]
      properties:
        position: { type: integer }
        line: { type: string }
        releaseId: { type: integer }
        title: { type: string }
        artists:
          type: array
          items: { type: string }
        committed:
          type: boolean
          description: False until the user confirms the match; shown with a marker until then.

    AttachReleaseRequestDto:
      type: object
      required: [releaseId]
      properties:
        releaseId:
          type: integer
          minimum: 1
          description: The Discogs release id; it must already be in the catalogue.

    EnrichmentPreviewDto:
      type: object
      required: [count, skipped, max]
      properties:
        count:
          type: integer
          description: Releases the run would fetch from Discogs.
        skipped:
          type: integer
          description: Releases matching the filter that the run leaves alone.
        max:
          type: integer
          nullable: true
          description: The most releases one run may fetch; null when there is no limit.

    StartEnrichmentRunRequestDto:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: The Explore query string, without page.
        fresh:
          type: boolean
          description: Fetch releases that were already enriched again.

    EnrichmentNotFoundDto:
      type: object
      required: [releaseId, title, artists]
      properties:
        releaseId: { type: integer }
        title: { type: string }
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseArtistDto"

    EnrichmentRunDto:
      type: object
      required:
        [id, status, query, fresh, total, skipped, enriched, notFound, failed, remaining, startedAt, finishedAt, errorMessage, pausedUntil, notFoundReleases]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [running, done, cancelled, failed]
        query: { type: string }
        fresh: { type: boolean }
        total:
          type: integer
          description: Releases queued for the run.
        skipped:
          type: integer
          description: Matching releases left alone - already enriched, or queued by another run.
        enriched: { type: integer }
        notFound:
          type: integer
          description: Releases Discogs no longer has; Explore hides them.
        failed: { type: integer }
        remaining:
          type: integer
          description: Fetches not finished yet.
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        errorMessage:
          type: string
          nullable: true
          description: Why a failed run stopped.
        pausedUntil:
          type: string
          format: date-time
          nullable: true
          description: While Discogs is erroring, when the run tries again.
        notFoundReleases:
          type: array
          items:
            $ref: "#/components/schemas/EnrichmentNotFoundDto"

    EnrichmentStatusDto:
      type: object
      required: [run]
      properties:
        run:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EnrichmentRunDto"

    DiscogsProfileDataDto:
      type: object
      required: [username, collectionCount, wantlistCount, fetchedAt, lastSyncedAt]
      properties:
        username: { type: string }
        collectionCount:
          type: integer
          description: >
            Releases in the collection. Before the first sync it is Discogs'
            own copy count, which counts a release owned twice twice.
        wantlistCount: { type: integer }
        fetchedAt:
          type: string
          format: date-time
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: When the last sync completed; null until the first one does.

    DiscogsSyncDto:
      type: object
      required: [status, error]
      properties:
        status:
          type: string
          enum: [idle, running, failed]
          description: >
            `running` covers queued, running and paused-and-retrying;
            `failed` keeps the last sync's error until the next one starts.
        error:
          type: string
          nullable: true
          description: What the user can act on; set only while `status` is `failed`.

    DiscogsProfileDto:
      type: object
      required: [tokenSet, profile, sync]
      properties:
        tokenSet:
          type: boolean
          description: Whether the user has saved a Discogs token.
        profile:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DiscogsProfileDataDto"
          description: Null until the first fetch, and whenever there is no token.
        sync:
          $ref: "#/components/schemas/DiscogsSyncDto"

    DiscogsTokenDto:
      type: object
      required: [set, username]
      properties:
        set: { type: boolean }
        username:
          type: string
          nullable: true
          description: The Discogs account the token belongs to; null when none is set.

    SetDiscogsTokenRequestDto:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 200
          description: A Discogs personal access token. Trimmed; must not be empty.

    SettingsDto:
      type: object
      required: [theme, rarityHaveMax]
      properties:
        theme:
          type: string
          enum: [light, dark]
          description: The colour theme of the app. Dark until the user picks light.
        rarityHaveMax:
          type: integer
          minimum: 1
          description: >
            The most haves a release can have and still be ranked by sort=-rarity. 1000 until the
            user changes it.

    UpdateSettingsRequestDto:
      type: object
      description: Any subset of SettingsDto.
      properties:
        theme:
          type: string
          enum: [light, dark]
        rarityHaveMax:
          type: integer
          minimum: 1

    FadedItemDto:
      type: object
      required: [kind, id, fadedAt, title, artists, year, versionsIndexed, lookupStatus]
      properties:
        kind:
          type: string
          enum: [master, release]
        id:
          type: integer
          description: The master id or release id, as stored; send it back to unfade.
        fadedAt:
          type: string
          format: date-time
        title:
          type: string
          nullable: true
          description: >
            Of the lowest-id indexed release the fade hides, else the title
            Discogs gave when the fade was looked up; null if neither is known.
        artists:
          type: array
          items: { $ref: "#/components/schemas/ReleaseArtistStub" }
        year:
          type: integer
          nullable: true
        versionsIndexed:
          type: integer
          description: Indexed releases the fade hides; 0 when none is indexed.
        lookupStatus:
          type: string
          enum: [pending, done, failed]
          description: Where the fade's Discogs lookup stands; failed when Discogs could not resolve it.

    FadedItemsDto:
      type: object
      required: [items, page, pageSize, total, fadedTotal]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FadedItemDto" }
        page: { type: integer }
        pageSize: { type: integer }
        total:
          type: integer
          description: Fades matching the search.
        fadedTotal:
          type: integer
          description: All of the collector's fades, ignoring the search.

    FadedIdsDto:
      type: object
      required: [masterIds, releaseIds, versionReleaseIds, failedLookups]
      properties:
        masterIds:
          type: array
          items: { type: integer }
        releaseIds:
          type: array
          items: { type: integer }
        versionReleaseIds:
          type: array
          items: { type: integer }
          description: Release ids under the faded masters, as far as their lookups have run.
        failedLookups:
          type: array
          description: Fades Discogs could not resolve. They stay in place; fading again retries.
          items:
            type: object
            required: [kind, id]
            properties:
              kind:
                type: string
                enum: [master, release]
              id:
                type: integer

    Artist:
      type: object
      required: [id, name, resource_url]
      properties:
        id: { type: integer }
        name: { type: string }
        anv: { type: string }
        join: { type: string }
        role: { type: string }
        tracks: { type: string }
        resource_url: { type: string }
        thumbnail_url: { type: string }

    Label:
      type: object
      required: [id, name, resource_url]
      properties:
        id: { type: integer }
        name: { type: string }
        catno: { type: string }
        entity_type: { type: string }
        entity_type_name: { type: string }
        resource_url: { type: string }
        thumbnail_url: { type: string }

    Company:
      $ref: "#/components/schemas/Label"

    Format:
      type: object
      required: [name]
      properties:
        name: { type: string }
        qty: { type: string }
        text: { type: string }
        descriptions:
          type: array
          items: { type: string }

    Identifier:
      type: object
      required: [type, value]
      properties:
        type: { type: string }
        value: { type: string }
        description: { type: string }

    Video:
      type: object
      required: [uri]
      properties:
        uri: { type: string }
        title: { type: string }
        description: { type: string }
        duration: { type: integer }
        embed: { type: boolean }

    Track:
      type: object
      required: [position, title]
      properties:
        position: { type: string }
        type_: { type: string }
        title: { type: string }
        duration: { type: string }
        extraartists:
          type: array
          items:
            $ref: "#/components/schemas/Artist"

    Image:
      type: object
      required: [type, uri, resource_url]
      properties:
        type: { type: string }
        uri: { type: string }
        resource_url: { type: string }
        uri150: { type: string }
        width: { type: integer }
        height: { type: integer }

    CommunityUser:
      type: object
      required: [username, resource_url]
      properties:
        username: { type: string }
        resource_url: { type: string }

    Community:
      type: object
      properties:
        have: { type: integer }
        want: { type: integer }
        rating:
          type: object
          properties:
            count: { type: integer }
            average: { type: number }
        submitter:
          $ref: "#/components/schemas/CommunityUser"
        contributors:
          type: array
          items:
            $ref: "#/components/schemas/CommunityUser"
        data_quality: { type: string }
        status: { type: string }

    ReleaseDetailDto:
      type: object
      description: >
        Served from our own database.
      required: [id, title, year, country, artists, labels, tracklist, videos]
      properties:
        id: { type: integer }
        title: { type: string }
        year: { type: integer, nullable: true }
        country: { type: string, nullable: true }
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseArtistStub"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseLabelDto"
        tracklist:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseTrack"
        videos:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseVideo"

    ReleaseArtistStub:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    ReleaseTrack:
      type: object
      required: [position, title]
      properties:
        position: { type: string }
        title: { type: string }
        duration: { type: string }

    ReleaseVideo:
      type: object
      required: [uri]
      properties:
        uri: { type: string }
        title: { type: string }
        duration: { type: integer }

    MasterDetailDto:
      type: object
      required: [id, resource_url, artists, title]
      properties:
        id: { type: integer }
        main_release: { type: integer }
        most_recent_release: { type: integer }
        resource_url: { type: string }
        uri: { type: string }
        versions_url: { type: string }
        main_release_url: { type: string }
        most_recent_release_url: { type: string }
        num_for_sale: { type: integer }
        lowest_price: { type: number }
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        year: { type: integer }
        tracklist:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
        title: { type: string }
        data_quality: { type: string }
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
