openapi: 3.0.3
info:
  title: discogs-fade-backend
  version: 0.1.0
  description: >
    Boundary between the extension and Discogs' API. Wraps GET /masters/{id} and
    GET and POST /fade — master DTOs are currently unscoped (all Discogs response
    fields kept as-is). GET /releases/{id} serves a trimmed release from our
    own database, and GET /releases lists and filters the releases stored there.
paths:
  /releases:
    get:
      operationId: listReleases
      summary: List every release
      description: >
        Pages, filters and sorts the stored releases; 400 on invalid input.
        Releases the user has faded (directly or through their master) are
        left out of items and total.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50 }
        - $ref: "#/components/parameters/StyleCombo"
        - name: genre
          in: query
          description: Comma-separated genre names, OR-matched
          schema:
            type: string
        - name: style
          in: query
          description: Comma-separated style names, OR-matched
          schema:
            type: string
        - name: format
          in: query
          description: Comma-separated format names (e.g. Vinyl, CD), OR-matched
          schema:
            type: string
        - name: country
          in: query
          description: Comma-separated country names, OR-matched
          schema:
            type: string
        - name: tracks
          in: query
          description: Comma-separated track counts, OR-matched; each is 1 to 6, or 7+ for seven or more
          schema:
            type: string
        - name: excludeGenre
          in: query
          description: Comma-separated genre names; releases with any of them are left out
          schema:
            type: string
        - name: excludeStyle
          in: query
          description: Comma-separated style names; releases with any of them are left out
          schema:
            type: string
        - name: excludeFormat
          in: query
          description: Comma-separated format names; releases with any of them are left out
          schema:
            type: string
        - name: onlyGenre
          in: query
          description: Comma-separated genre names; keeps releases whose genres are all in the list
          schema:
            type: string
        - name: onlyStyle
          in: query
          description: Comma-separated style names; keeps releases whose styles are all in the list
          schema:
            type: string
        - name: onlyFormat
          in: query
          description: Comma-separated format names; keeps releases whose formats are all in the list
          schema:
            type: string
        - name: noLinks
          in: query
          description: "only keeps releases with no video links; exclude leaves them out"
          schema:
            type: string
            enum: [only, exclude]
        - name: yearMin
          in: query
          schema: { type: integer }
        - name: yearMax
          in: query
          schema: { type: integer }
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [title, -title, year, -year, artist, -artist, format, -format, tracks, -tracks]
            default: title
      responses:
        "200":
          description: Paginated releases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseListPageDto"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /releases/facets:
    get:
      operationId: getReleaseFacets
      summary: >
        The genres, styles, format names and countries of all stored releases,
        each with how many releases carry it, counted among the releases the same
        filters would list (faded ones excluded).
      parameters:
        - $ref: "#/components/parameters/Genre"
        - $ref: "#/components/parameters/Style"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Tracks"
        - $ref: "#/components/parameters/ExcludeGenre"
        - $ref: "#/components/parameters/ExcludeStyle"
        - $ref: "#/components/parameters/ExcludeFormat"
        - $ref: "#/components/parameters/OnlyGenre"
        - $ref: "#/components/parameters/OnlyStyle"
        - $ref: "#/components/parameters/OnlyFormat"
        - $ref: "#/components/parameters/NoLinks"
        - $ref: "#/components/parameters/YearMin"
        - $ref: "#/components/parameters/YearMax"
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseFacetsDto"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /releases/{id}:
    get:
      operationId: getRelease
      summary: >
        Get a release by id from our database. 404 when it is not stored.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Release found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetailDto"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /fade:
    get:
      operationId: getFades
      summary: List what the signed-in user has faded
      description: >
        Faded masters and releases without a master. A release is hidden when
        its own id is in releaseIds or its master id is in masterIds, which
        also covers versions added to a faded master later. versionReleaseIds
        lists the versions of the faded masters found so far, and
        failedLookups the fades Discogs could not resolve.
      responses:
        "200":
          description: Faded ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FadedIdsDto"
    post:
      operationId: fade
      summary: >
        Fade a release or a master for the signed-in user. Any release or
        master can be faded, indexed or not. A release with a known master is
        stored as that master, hiding every version under it. Any other
        release is stored as itself, and a lookup upgrades it to its master and stores the master's
        versions. The request waits for that lookup (up to about 20 seconds),
        so the answer names the fade and counts what it hides. If the wait
        runs out, or Discogs is paused, lookupStatus is pending, versionCount
        is null and the lookup carries on in the background. Fading a failed
        fade again retries its lookup. Otherwise idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FadeRequestDto"
      responses:
        "200":
          description: Fade stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FadeResponseDto"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
    delete:
      operationId: unfade
      summary: >
        Unfade a release or a master for the signed-in user. A release with a
        master unfades that master and every version under it. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FadeRequestDto"
      responses:
        "204":
          description: Fade removed, or there was none
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /fade/items:
    get:
      operationId: getFadedItems
      summary: Page through what the signed-in user has faded
      description: >
        One row per stored fade (a master, or a release without a master),
        newest first, each with the lowest-id indexed release it hides.
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: >
            Case-insensitive substring of a title or artist name of any indexed
            release the fade hides.
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, default: 50 }
      responses:
        "200":
          description: A page of fades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FadedItemsDto"
        "400":
          description: Invalid page or pageSize
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /settings:
    get:
      operationId: getSettings
      summary: The signed-in user's settings
      description: >
        A setting the user never changed holds its default, so a user with no
        stored settings gets them all.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDto"
    patch:
      operationId: updateSettings
      summary: Change some of the signed-in user's settings
      description: >
        Takes any subset of the settings; the ones left out stay as they are.
        An empty body changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequestDto"
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDto"
        "400":
          description: A setting holds a value it does not allow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /masters/{id}:
    get:
      operationId: getMaster
      summary: Get a master release by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Master found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDetailDto"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Master not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
components:
  parameters:
    Genre:
      name: genre
      in: query
      description: Comma-separated genre names, OR-matched
      schema: { type: string }
    Style:
      name: style
      in: query
      description: Comma-separated style names, OR-matched
      schema: { type: string }
    Format:
      name: format
      in: query
      description: Comma-separated format names (e.g. Vinyl, CD), OR-matched
      schema: { type: string }
    Country:
      name: country
      in: query
      description: Comma-separated country names, OR-matched
      schema: { type: string }
    Tracks:
      name: tracks
      in: query
      description: Comma-separated track counts, OR-matched; each is 1 to 6, or 7+ for seven or more
      schema: { type: string }
    ExcludeGenre:
      name: excludeGenre
      in: query
      description: Comma-separated genre names; releases with any of them are left out
      schema: { type: string }
    ExcludeStyle:
      name: excludeStyle
      in: query
      description: Comma-separated style names; releases with any of them are left out
      schema: { type: string }
    ExcludeFormat:
      name: excludeFormat
      in: query
      description: Comma-separated format names; releases with any of them are left out
      schema: { type: string }
    OnlyGenre:
      name: onlyGenre
      in: query
      description: Comma-separated genre names; keeps releases whose genres are all in the list
      schema: { type: string }
    OnlyStyle:
      name: onlyStyle
      in: query
      description: Comma-separated style names; keeps releases whose styles are all in the list
      schema: { type: string }
    OnlyFormat:
      name: onlyFormat
      in: query
      description: Comma-separated format names; keeps releases whose formats are all in the list
      schema: { type: string }
    StyleCombo:
      name: styleCombo
      in: query
      description: >
        A style combination: comma-separated style names a release must all have.
        Repeat the parameter for several combinations; a release passes when it
        matches any one of them. `GET /releases` only; the facets ignore it, so
        counts do not follow combinations.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }
    NoLinks:
      name: noLinks
      in: query
      description: "only keeps releases with no video links; exclude leaves them out"
      schema:
        type: string
        enum: [only, exclude]
    YearMin:
      name: yearMin
      in: query
      schema: { type: integer }
    YearMax:
      name: yearMax
      in: query
      schema: { type: integer }
  schemas:
    ErrorDto:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ReleaseFormatDto:
      type: object
      required: [name, descriptions]
      properties:
        name: { type: string }
        descriptions:
          type: array
          items: { type: string }

    ReleaseArtistDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    ReleaseListItemDto:
      type: object
      required:
        [releaseId, title, year, country, genres, styles, formats, artists]
      properties:
        releaseId: { type: integer }
        title: { type: string }
        year: { type: integer, nullable: true }
        country: { type: string, nullable: true }
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        formats:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseFormatDto"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseArtistDto"

    ReleaseListPageDto:
      type: object
      required: [items, page, pageSize, total, fadedCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseListItemDto"
        page: { type: integer }
        pageSize: { type: integer }
        total:
          type: integer
          description: Releases matching the current filters, faded ones excluded.
        fadedCount:
          type: integer
          description: How many releases the user has faded. Ignores filters.

    FacetValueDto:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count:
          type: integer
          description: How many of the releases matching the filters carry the value.

    ReleaseFacetsDto:
      type: object
      description: >
        The values of each category among the releases matching the filters, most
        common first (ties alphabetical). Values no matching release carries are left out.
      required: [genres, styles, formats, countries]
      properties:
        genres:
          type: array
          items: { $ref: "#/components/schemas/FacetValueDto" }
        styles:
          type: array
          items: { $ref: "#/components/schemas/FacetValueDto" }
        formats:
          type: array
          items: { $ref: "#/components/schemas/FacetValueDto" }
        countries:
          type: array
          items: { $ref: "#/components/schemas/FacetValueDto" }

    FadeRequestDto:
      type: object
      description: Provide exactly one of releaseId or masterId.
      properties:
        releaseId:
          type: integer
        masterId:
          type: integer

    FadeResponseDto:
      type: object
      required: [kind, id, lookupStatus, title, artists, versionCount]
      properties:
        kind:
          type: string
          enum: [master, release]
        id:
          type: integer
        lookupStatus:
          type: string
          enum: [pending, done, failed]
          description: >
            pending until the master and its versions are known, done once they
            are (or the release has no master), failed when Discogs could not
            resolve it.
        title:
          type: string
          nullable: true
          description: The title of the faded release or master, when known.
        artists:
          type: array
          items: { $ref: "#/components/schemas/ReleaseArtistStub" }
        versionCount:
          type: integer
          nullable: true
          description: >
            Releases the fade hides: the master's versions, or 1 for a release
            without a master. Null unless lookupStatus is done.

    SettingsDto:
      type: object
      required: [theme]
      properties:
        theme:
          type: string
          enum: [light, dark]
          description: The colour theme of the app. Dark until the user picks light.

    UpdateSettingsRequestDto:
      type: object
      description: Any subset of SettingsDto.
      properties:
        theme:
          type: string
          enum: [light, dark]

    FadedItemDto:
      type: object
      required: [kind, id, fadedAt, title, artists, year, versionsIndexed, lookupStatus]
      properties:
        kind:
          type: string
          enum: [master, release]
        id:
          type: integer
          description: The master id or release id, as stored; send it back to unfade.
        fadedAt:
          type: string
          format: date-time
        title:
          type: string
          nullable: true
          description: >
            Of the lowest-id indexed release the fade hides, else the title
            Discogs gave when the fade was looked up; null if neither is known.
        artists:
          type: array
          items: { $ref: "#/components/schemas/ReleaseArtistStub" }
        year:
          type: integer
          nullable: true
        versionsIndexed:
          type: integer
          description: Indexed releases the fade hides; 0 when none is indexed.
        lookupStatus:
          type: string
          enum: [pending, done, failed]
          description: Where the fade's Discogs lookup stands; failed when Discogs could not resolve it.

    FadedItemsDto:
      type: object
      required: [items, page, pageSize, total, fadedTotal]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FadedItemDto" }
        page: { type: integer }
        pageSize: { type: integer }
        total:
          type: integer
          description: Fades matching the search.
        fadedTotal:
          type: integer
          description: All of the collector's fades, ignoring the search.

    FadedIdsDto:
      type: object
      required: [masterIds, releaseIds, versionReleaseIds, failedLookups]
      properties:
        masterIds:
          type: array
          items: { type: integer }
        releaseIds:
          type: array
          items: { type: integer }
        versionReleaseIds:
          type: array
          items: { type: integer }
          description: Release ids under the faded masters, as far as their lookups have run.
        failedLookups:
          type: array
          description: Fades Discogs could not resolve. They stay in place; fading again retries.
          items:
            type: object
            required: [kind, id]
            properties:
              kind:
                type: string
                enum: [master, release]
              id:
                type: integer

    Artist:
      type: object
      required: [id, name, resource_url]
      properties:
        id: { type: integer }
        name: { type: string }
        anv: { type: string }
        join: { type: string }
        role: { type: string }
        tracks: { type: string }
        resource_url: { type: string }
        thumbnail_url: { type: string }

    Label:
      type: object
      required: [id, name, resource_url]
      properties:
        id: { type: integer }
        name: { type: string }
        catno: { type: string }
        entity_type: { type: string }
        entity_type_name: { type: string }
        resource_url: { type: string }
        thumbnail_url: { type: string }

    Company:
      $ref: "#/components/schemas/Label"

    Format:
      type: object
      required: [name]
      properties:
        name: { type: string }
        qty: { type: string }
        text: { type: string }
        descriptions:
          type: array
          items: { type: string }

    Identifier:
      type: object
      required: [type, value]
      properties:
        type: { type: string }
        value: { type: string }
        description: { type: string }

    Video:
      type: object
      required: [uri]
      properties:
        uri: { type: string }
        title: { type: string }
        description: { type: string }
        duration: { type: integer }
        embed: { type: boolean }

    Track:
      type: object
      required: [position, title]
      properties:
        position: { type: string }
        type_: { type: string }
        title: { type: string }
        duration: { type: string }
        extraartists:
          type: array
          items:
            $ref: "#/components/schemas/Artist"

    Image:
      type: object
      required: [type, uri, resource_url]
      properties:
        type: { type: string }
        uri: { type: string }
        resource_url: { type: string }
        uri150: { type: string }
        width: { type: integer }
        height: { type: integer }

    CommunityUser:
      type: object
      required: [username, resource_url]
      properties:
        username: { type: string }
        resource_url: { type: string }

    Community:
      type: object
      properties:
        have: { type: integer }
        want: { type: integer }
        rating:
          type: object
          properties:
            count: { type: integer }
            average: { type: number }
        submitter:
          $ref: "#/components/schemas/CommunityUser"
        contributors:
          type: array
          items:
            $ref: "#/components/schemas/CommunityUser"
        data_quality: { type: string }
        status: { type: string }

    ReleaseDetailDto:
      type: object
      description: >
        Served from our own database.
      required: [id, title, year, country, artists, tracklist, videos]
      properties:
        id: { type: integer }
        title: { type: string }
        year: { type: integer, nullable: true }
        country: { type: string, nullable: true }
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseArtistStub"
        tracklist:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseTrack"
        videos:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseVideo"

    ReleaseArtistStub:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    ReleaseTrack:
      type: object
      required: [position, title]
      properties:
        position: { type: string }
        title: { type: string }
        duration: { type: string }

    ReleaseVideo:
      type: object
      required: [uri]
      properties:
        uri: { type: string }
        title: { type: string }
        duration: { type: integer }

    MasterDetailDto:
      type: object
      required: [id, resource_url, artists, title]
      properties:
        id: { type: integer }
        main_release: { type: integer }
        most_recent_release: { type: integer }
        resource_url: { type: string }
        uri: { type: string }
        versions_url: { type: string }
        main_release_url: { type: string }
        most_recent_release_url: { type: string }
        num_for_sale: { type: integer }
        lowest_price: { type: number }
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        year: { type: integer }
        tracklist:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
        title: { type: string }
        data_quality: { type: string }
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
