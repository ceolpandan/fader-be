openapi: 3.0.3
info:
  title: discogs-fade-backend
  version: 0.1.0
  description: >
    Boundary between the extension and Discogs' API. Wraps GET /masters/{id} and
    GET and POST /fade — master DTOs are currently unscoped (all Discogs response
    fields kept as-is). GET /releases/{id} serves a trimmed release from our
    own database. Also exposes
    /sellers/... endpoints that list indexed sellers, trigger and report on
    indexing a Discogs seller's marketplace inventory into a local database
    via a Discogs-rate-limited background queue, and browse/filter/sort the
    resulting inventory.
paths:
  /releases/{id}:
    get:
      operationId: getRelease
      summary: >
        Get a release by id from our database; falls back to a live Discogs
        fetch (saved for next time) when it is not indexed yet.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Release found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetailDto"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "502":
          description: Discogs fetch failed after retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Discogs is erroring and the queue is paused, retrying; try again shortly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "504":
          description: Timed out waiting for the Discogs fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /releases/{id}/refresh:
    post:
      operationId: refreshRelease
      summary: >
        Force-refresh a release: fetch it live from Discogs (ahead of any
        background indexing in the queue), overwrite everything stored for it,
        and return the fresh release.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Release refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDetailDto"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Release not found on Discogs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "502":
          description: Discogs fetch failed after retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          description: Discogs is erroring and the queue is paused, retrying; try again shortly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "504":
          description: Timed out waiting for the Discogs fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /fade:
    get:
      operationId: getFades
      summary: List what the signed-in user has faded
      description: >
        Faded masters and releases without a master. A release is hidden when
        its own id is in releaseIds or its master id is in masterIds, which
        also covers versions added to a faded master later.
      responses:
        "200":
          description: Faded ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FadedIdsDto"
    post:
      operationId: fade
      summary: >
        Fade a release or a master for the signed-in user. A release with a
        master is stored as that master, hiding every version under it.
        Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FadeRequestDto"
      responses:
        "200":
          description: Fade stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FadeResponseDto"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Release is not indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /masters/{id}:
    get:
      operationId: getMaster
      summary: Get a master release by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Master found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDetailDto"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: Master not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /sellers:
    get:
      operationId: listSellers
      summary: List every seller that has ever been indexed
      responses:
        "200":
          description: Sellers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerSummaryDto"
  /sellers/{username}/index:
    post:
      operationId: startSellerIndexing
      summary: >
        Start (or re-trigger) indexing a Discogs seller's inventory. Fetches
        their full marketplace inventory and enriches each release, through
        the rate-limited Discogs request queue, in the background.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Indexing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexStartedDto"
        "409":
          description: Indexing is already running for this seller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /sellers/{username}:
    get:
      operationId: getSellerStatus
      summary: Get a seller's indexing status and progress
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Seller status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerStatusDto"
        "404":
          description: This username has never been indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
    delete:
      operationId: removeSeller
      summary: >
        Remove a seller: stop any indexing run for it and delete the seller, its inventory links,
        its scan passes and its queued jobs. Releases and fades are kept.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Seller removed
        "404":
          description: This username has never been indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /sellers/{username}/inventory:
    get:
      operationId: getSellerInventory
      summary: List a seller's active, indexed inventory (already-enriched releases only)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
        - name: genre
          in: query
          description: Comma-separated genre names, OR-matched
          schema:
            type: string
        - name: style
          in: query
          description: Comma-separated style names, OR-matched
          schema:
            type: string
        - name: excludeGenre
          in: query
          description: Comma-separated genre names; releases with any of them are left out
          schema:
            type: string
        - name: excludeStyle
          in: query
          description: Comma-separated style names; releases with any of them are left out
          schema:
            type: string
        - name: excludeFormat
          in: query
          description: Comma-separated format names; releases with any of them are left out
          schema:
            type: string
        - name: onlyGenre
          in: query
          description: Comma-separated genre names; keeps releases whose genres are all in the list
          schema:
            type: string
        - name: onlyStyle
          in: query
          description: Comma-separated style names; keeps releases whose styles are all in the list
          schema:
            type: string
        - name: onlyFormat
          in: query
          description: Comma-separated format names; keeps releases whose formats are all in the list
          schema:
            type: string
        - name: format
          in: query
          description: Comma-separated format names (e.g. Vinyl, CD), OR-matched
          schema:
            type: string
        - name: country
          in: query
          description: Comma-separated country names, OR-matched
          schema:
            type: string
        - name: yearMin
          in: query
          schema:
            type: integer
        - name: yearMax
          in: query
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
            enum:
              [
                title,
                -title,
                year,
                -year,
                artist,
                -artist,
                format,
                -format,
                rating,
                -rating,
              ]
            default: title
      responses:
        "200":
          description: Paginated inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerInventoryPageDto"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /sellers/{username}/inventory/facets:
    get:
      operationId: getSellerInventoryFacets
      summary: >
        Distinct genres, styles, format names, and countries present across a
        seller's full inventory (all statuses, faded items excluded; not
        affected by any inventory filters).
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerInventoryFacetsDto"

components:
  schemas:
    ErrorDto:
      type: object
      required: [error]
      properties:
        error:
          type: string

    IndexStartedDto:
      type: object
      required: [username, runId]
      properties:
        username: { type: string }
        runId: { type: string }

    SellerSummaryDto:
      type: object
      required: [username, lastIndexedAt, lastIndexStatus, forSaleCount, fadedCount, coverage]
      properties:
        username: { type: string }
        lastIndexedAt:
          type: string
          nullable: true
        lastIndexStatus:
          type: string
          enum: [never, running, success, error]
        forSaleCount:
          type: integer
          description: The seller's active, enriched items, faded ones included.
        fadedCount:
          type: integer
          description: How many of forSaleCount are faded for the user.
        coverage:
          type: object
          nullable: true
          description: Inventory items we can reach out of all the seller lists; null before the first scan.
          required: [reachable, total]
          properties:
            reachable: { type: integer }
            total: { type: integer }

    ReleaseFormatDto:
      type: object
      required: [name, descriptions]
      properties:
        name: { type: string }
        descriptions:
          type: array
          items: { type: string }

    ReleaseArtistDto:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    SellerStatusDto:
      type: object
      required:
        [
          username,
          lastIndexedAt,
          lastIndexStatus,
          currentlyRunning,
          totalReleasesFound,
          releasesEnriched,
          releasesFailed,
          sellerRating,
          sellerNumRatings,
          shipsFromCountry,
          phase,
          scan,
          etaSeconds,
          retryingAt,
          backoffMs,
          coverage,
          scanPasses,
        ]
      properties:
        username: { type: string }
        lastIndexedAt:
          type: string
          nullable: true
        lastIndexStatus:
          type: string
          enum: [never, running, success, error]
        currentlyRunning: { type: boolean }
        totalReleasesFound: { type: integer }
        releasesEnriched: { type: integer }
        releasesFailed: { type: integer }
        sellerRating:
          type: number
          nullable: true
          description: Seller rating as a percentage, e.g. 96.4.
        sellerNumRatings: { type: integer, nullable: true }
        shipsFromCountry: { type: string, nullable: true }
        phase:
          type: string
          enum: [scanning, enriching, done]
          description: scanning while inventory pages are fetched, enriching while releases are, done otherwise.
        scan:
          type: object
          nullable: true
          description: Inventory scan progress of the current run; null until page 1 is fetched.
          required: [pagesFetched, pagesTotal]
          properties:
            pagesFetched: { type: integer }
            pagesTotal: { type: integer }
        etaSeconds:
          type: integer
          nullable: true
          description: Seconds until enrichment finishes; null when unknown (too few releases enriched yet) or not enriching.
        retryingAt:
          type: string
          nullable: true
          description: When the paused Discogs queue retries (ISO); null while the queue is not paused.
        backoffMs: { type: integer, nullable: true }
        coverage:
          type: object
          nullable: true
          description: Distinct inventory items the current run has seen, out of all the seller lists. Discogs only serves the first 100 pages of an inventory per sort order, so reachable is lower than total for large sellers until further sort orders have run. A single pass that returned every listing counts as the whole inventory.
          required: [reachable, total]
          properties:
            reachable: { type: integer }
            total: { type: integer }
        scanPasses:
          type: array
          description: The sorted inventory passes of the current run, in the order they ran. Passes (each sort ascending, then descending) keep running until every inventory item has been seen or all of them have run.
          items:
            $ref: "#/components/schemas/ScanPassDto"

    ScanPassDto:
      type: object
      required:
        [sort, order, status, pagesPlanned, pagesFetched, itemsSeen, itemsNew, startedAt, endedAt]
      properties:
        sort: { type: string, enum: [artist, listed, label, catno, item, price, audio] }
        order: { type: string, enum: [asc, desc] }
        status:
          type: string
          enum: [running, done, capped, failed]
          description: capped means Discogs refused to paginate any further, so the pass ended cleanly. failed means a page kept failing, so the pass was abandoned and the scan moved on.
        pagesPlanned: { type: integer }
        pagesFetched: { type: integer }
        itemsSeen: { type: integer, description: Listings Discogs returned in this pass. }
        itemsNew: { type: integer, description: Inventory links this pass was the first of the run to see. }
        startedAt: { type: string }
        endedAt: { type: string, nullable: true }

    SellerInventoryItemDto:
      type: object
      required:
        [
          releaseId,
          title,
          thumb,
          year,
          country,
          genres,
          styles,
          formats,
          ratingAverage,
          ratingCount,
          haves,
          wants,
          artists,
          status,
          firstSeenAt,
          soldAt,
        ]
      properties:
        releaseId: { type: integer }
        title: { type: string }
        thumb:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        country:
          type: string
          nullable: true
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        formats:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseFormatDto"
        ratingAverage:
          type: number
          nullable: true
        ratingCount:
          type: integer
          nullable: true
        haves:
          type: integer
          nullable: true
        wants:
          type: integer
          nullable: true
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseArtistDto"
        status:
          type: string
          enum: [active, sold]
        firstSeenAt: { type: string }
        soldAt:
          type: string
          nullable: true

    SellerInventoryPageDto:
      type: object
      required: [items, page, pageSize, total, forSaleCount, fadedCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SellerInventoryItemDto"
        page: { type: integer }
        pageSize: { type: integer }
        total:
          type: integer
          description: Items matching the current filters, faded ones excluded.
        forSaleCount:
          type: integer
          description: >
            The seller's active, enriched items, faded ones included. Ignores
            filters.
        fadedCount:
          type: integer
          description: How many of forSaleCount are faded for the user. Ignores filters.

    SellerInventoryFacetsDto:
      type: object
      required: [genres, styles, formats, countries]
      properties:
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        formats:
          type: array
          items: { type: string }
        countries:
          type: array
          items: { type: string }

    FadeRequestDto:
      type: object
      description: Provide exactly one of releaseId or masterId.
      properties:
        releaseId:
          type: integer
        masterId:
          type: integer

    FadeResponseDto:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [master, release]
        id:
          type: integer

    FadedIdsDto:
      type: object
      required: [masterIds, releaseIds]
      properties:
        masterIds:
          type: array
          items: { type: integer }
        releaseIds:
          type: array
          items: { type: integer }

    Artist:
      type: object
      required: [id, name, resource_url]
      properties:
        id: { type: integer }
        name: { type: string }
        anv: { type: string }
        join: { type: string }
        role: { type: string }
        tracks: { type: string }
        resource_url: { type: string }
        thumbnail_url: { type: string }

    Label:
      type: object
      required: [id, name, resource_url]
      properties:
        id: { type: integer }
        name: { type: string }
        catno: { type: string }
        entity_type: { type: string }
        entity_type_name: { type: string }
        resource_url: { type: string }
        thumbnail_url: { type: string }

    Company:
      $ref: "#/components/schemas/Label"

    Format:
      type: object
      required: [name]
      properties:
        name: { type: string }
        qty: { type: string }
        text: { type: string }
        descriptions:
          type: array
          items: { type: string }

    Identifier:
      type: object
      required: [type, value]
      properties:
        type: { type: string }
        value: { type: string }
        description: { type: string }

    Video:
      type: object
      required: [uri]
      properties:
        uri: { type: string }
        title: { type: string }
        description: { type: string }
        duration: { type: integer }
        embed: { type: boolean }

    Track:
      type: object
      required: [position, title]
      properties:
        position: { type: string }
        type_: { type: string }
        title: { type: string }
        duration: { type: string }
        extraartists:
          type: array
          items:
            $ref: "#/components/schemas/Artist"

    Image:
      type: object
      required: [type, uri, resource_url]
      properties:
        type: { type: string }
        uri: { type: string }
        resource_url: { type: string }
        uri150: { type: string }
        width: { type: integer }
        height: { type: integer }

    CommunityUser:
      type: object
      required: [username, resource_url]
      properties:
        username: { type: string }
        resource_url: { type: string }

    Community:
      type: object
      properties:
        have: { type: integer }
        want: { type: integer }
        rating:
          type: object
          properties:
            count: { type: integer }
            average: { type: number }
        submitter:
          $ref: "#/components/schemas/CommunityUser"
        contributors:
          type: array
          items:
            $ref: "#/components/schemas/CommunityUser"
        data_quality: { type: string }
        status: { type: string }

    ReleaseDetailDto:
      type: object
      description: >
        Served from our own database (fetched live from Discogs and saved on
        first request if the release is not indexed yet).
      required: [id, title, year, country, artists, tracklist, videos]
      properties:
        id: { type: integer }
        title: { type: string }
        thumb: { type: string }
        year: { type: integer, nullable: true }
        country: { type: string, nullable: true }
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseArtistStub"
        tracklist:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseTrack"
        videos:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseVideo"

    ReleaseArtistStub:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    ReleaseTrack:
      type: object
      required: [position, title]
      properties:
        position: { type: string }
        title: { type: string }
        duration: { type: string }

    ReleaseVideo:
      type: object
      required: [uri]
      properties:
        uri: { type: string }
        title: { type: string }
        duration: { type: integer }

    MasterDetailDto:
      type: object
      required: [id, resource_url, artists, title]
      properties:
        id: { type: integer }
        main_release: { type: integer }
        most_recent_release: { type: integer }
        resource_url: { type: string }
        uri: { type: string }
        versions_url: { type: string }
        main_release_url: { type: string }
        most_recent_release_url: { type: string }
        num_for_sale: { type: integer }
        lowest_price: { type: number }
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        genres:
          type: array
          items: { type: string }
        styles:
          type: array
          items: { type: string }
        year: { type: integer }
        tracklist:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
        title: { type: string }
        data_quality: { type: string }
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
